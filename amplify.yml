version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd Frontend
        - nvm use 20
        - npm ci
    build:
      commands:
        - npm run build
        - npm run export   # <-- export static files to "out" folder
  artifacts:
    baseDirectory: Frontend/out   # <-- change from .next to out
    files:
      - '**/*'
  cache:
    paths:
      - Frontend/node_modules/**/*
